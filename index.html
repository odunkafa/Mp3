<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MP3 Çalar</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;width:100%;height:100%;
  overflow:hidden;
  background:#f3e5c5;
  color:#17233b;
  font-family:Arial,sans-serif;
}
body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
.cr{
  width:100%;
  max-width:600px;
  height:100vh;
  padding:18px 14px;
  background:#fff8e8;
  border:5px solid #17233b;
  border-radius:30px;
  box-shadow:9px 9px 0 #17233b;
  overflow:hidden;
  position:relative;
}
.cr-ust{
  display:flex;
  justify-content:space-between;
}
.cr-ikon{
  width:58px;height:58px;
  border:5px solid #17233b;
  border-radius:18px;
  background:#f7cf62;
  box-shadow:5px 5px 0 #17233b;
  font-size:27px;
  color:#17233b;
  cursor:pointer;
}
.cr-baslik{
  text-align:center;
  font-size:42px;
  line-height:1;
  font-weight:900;
  margin:25px 0 8px;
  text-shadow:4px 4px #f7cf62;
}
.cr-alt{
  text-align:center;
  font-size:12px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:25px;
}
.cr-video{
  width:100%;
  aspect-ratio:16/9;
  background:#111;
  border:6px solid #17233b;
  border-radius:25px;
  overflow:hidden;
  box-shadow:7px 7px 0 #17233b;
}
#youtube-player{width:100%;height:100%}
.cr-bilgi{text-align:center;margin:20px 0 9px}
.cr-sarki{
  font-size:24px;
  line-height:1.1;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cr-durum{
  font-size:12px;
  font-weight:900;
  opacity:.6;
  margin-top:7px;
}
.cr-zaman{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:900;
  margin:8px 2px;
}
.cr-progress{
  width:100%;
  height:11px;
  appearance:none;
  border:3px solid #17233b;
  border-radius:20px;
  background:#d5d0c2;
}
.cr-progress::-webkit-slider-thumb{
  appearance:none;
  width:23px;height:23px;
  border:3px solid #17233b;
  border-radius:50%;
  background:#f7cf62;
}
.cr-kontroller{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:22px;
  margin:22px 0;
}
.cr-btn{
  width:70px;height:70px;
  border:5px solid #17233b;
  border-radius:50%;
  background:#fff8e8;
  box-shadow:6px 6px 0 #17233b;
  font-size:17px;
  font-weight:900;
  color:#17233b;
  cursor:pointer;
}
.cr-play{
  width:92px;height:92px;
  background:#f7cf62;
  font-size:0;
}
.cr-play::before{content:"▶";font-size:34px}
.cr-play.oynuyor::before{content:"Ⅱ";font-size:34px}
.cr-ses{
  display:flex;
  align-items:center;
  gap:10px;
}
.cr-ses input{flex:1}
button:active{
  transform:translate(3px,3px);
  box-shadow:2px 2px 0 #17233b;
}

/* ŞARKI LİSTESİ */
.liste-panel{
  position:absolute;
  inset:0;
  z-index:20;
  display:none;
  background:#fff8e8;
  padding:18px;
}
.liste-panel.acik{display:block}
.liste-ust{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}
.liste-baslik{
  font-size:28px;
  font-weight:900;
}
.kapat{
  width:48px;height:48px;
  border:4px solid #17233b;
  border-radius:15px;
  background:#f7cf62;
  box-shadow:4px 4px 0 #17233b;
  font-size:24px;
  font-weight:900;
}
.liste{
  height:calc(100vh - 105px);
  overflow-y:auto;
  padding:3px 5px 20px 2px;
}
.sarki-item{
  width:100%;
  text-align:left;
  border:4px solid #17233b;
  border-radius:16px;
  background:#fff;
  box-shadow:4px 4px 0 #17233b;
  padding:14px;
  margin:0 0 12px;
  color:#17233b;
  cursor:pointer;
}
.sarki-item.aktif{background:#f7cf62}
.sarki-numara{
  font-size:11px;
  font-weight:900;
  opacity:.55;
}
.sarki-ad{
  font-size:18px;
  font-weight:900;
  margin-top:3px;
}
.sarki-alt{
  font-size:11px;
  font-weight:700;
  margin-top:4px;
  opacity:.65;
}

@media(max-width:500px){
  .cr{padding:15px 11px}
  .cr-baslik{font-size:34px;margin-top:22px}
  .cr-alt{margin-bottom:18px}
  .cr-video{border-width:5px}
  .cr-sarki{font-size:21px}
  .cr-kontroller{gap:16px;margin:18px 0}
  .cr-btn{width:64px;height:64px}
  .cr-play{width:84px;height:84px}
}
</style>
</head>
<body>

<div class="cr">

  <div class="cr-ust">
    <button class="cr-ikon" id="listeAc" type="button" aria-label="Şarkı listesi">☰</button>
  </div>

  <div class="cr-video">
    <div id="youtube-player"></div>
  </div>

  <div class="cr-bilgi">
    <div class="cr-sarki" id="sarkiAdi">Şarkı seçin</div>
    <div class="cr-durum" id="durum">HAZIRLANIYOR...</div>
  </div>

  <div class="cr-zaman">
    <span id="gecen">00:00</span>
    <span id="toplam">00:00</span>
  </div>

  <input id="progress" class="cr-progress"
         type="range" min="0" max="100" value="0" step="0.1">

  <div class="cr-kontroller">
    <button id="geri" class="cr-btn" type="button">−10</button>
    <button id="oynat" class="cr-btn cr-play" type="button" aria-label="Oynat"></button>
    <button id="ileri" class="cr-btn" type="button">+10</button>
  </div>

  <div class="cr-ses">
    <span>🔊</span>
    <input id="ses" type="range" min="0" max="100" value="100">
  </div>

  <!-- Liste paneli -->
  <div class="liste-panel" id="listePanel">
    <div class="liste-ust">
      <div class="liste-baslik">ŞARKILAR</div>
      <button class="kapat" id="listeKapat" type="button">×</button>
    </div>
    <div class="liste" id="liste"></div>
  </div>

</div>

<script>
var oynatici=null;
var takip=null;
/* videolar.js içindeki SADECE URL listesi */
var videoLinkleri = [];
var sarkilar = [];
var seciliIndex = 0;

async function bilgileriGetir(){
  videoLinkleri = Array.isArray(window.VIDEOLAR) ? window.VIDEOLAR : [];
  sarkilar = [];

  for(var i=0;i<videoLinkleri.length;i++){
    var url = videoLinkleri[i];
    var id = videoIdBul(url);

    if(!id) continue;

    try{
      var cevap = await fetch(
        "https://www.youtube.com/oembed?url="+encodeURIComponent(url)+"&format=json"
      );
      var bilgi = await cevap.json();

      sarkilar.push({
        ad: bilgi.title || "YouTube Videosu",
        sanatci: bilgi.author_name || "YouTube",
        url: url
      });
    }catch(e){
      sarkilar.push({
        ad: "YouTube Videosu",
        sanatci: "YouTube",
        url: url
      });
    }
  }

  listeyiOlustur();

  if(sarkilar.length){
    document.getElementById("sarkiAdi").textContent=sarkilar[0].ad;
  }else{
    document.getElementById("sarkiAdi").textContent="Video ekleyin";
  }

  if(window.ytHazir) ilkVideoyuHazirla();
}

function ilkVideoyuHazirla(){
  if(!oynatici || !sarkilar.length) return;
  var id=videoIdBul(sarkilar[0].url);
  if(id) oynatici.cueVideoById(id);
  aktifListeyiGuncelle();
}

function videoIdBul(url){
  if(!url)return "";
  url=url.trim();

  /* Direkt ID yazılmışsa */
  if(/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;

  var eslesme=url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
  return eslesme ? eslesme[1] : "";
}

function formatSure(s){
  s=Math.floor(s||0);
  var dakika=Math.floor(s/60);
  var saniye=s%60;
  return String(dakika).padStart(2,"0")+":"+String(saniye).padStart(2,"0");
}

function listeyiOlustur(){
  var kutu=document.getElementById("liste");
  kutu.innerHTML="";

  if(!sarkilar.length){
    kutu.innerHTML='<div style="font-weight:900;padding:20px">videolar.js içine YouTube videolarını ekleyin.</div>';
    return;
  }

  sarkilar.forEach(function(sarki,index){
    var buton=document.createElement("button");
    buton.className="sarki-item";
    buton.innerHTML=
      '<div class="sarki-numara">'+String(index+1).padStart(2,"0")+'</div>'+
      '<div class="sarki-ad">'+(sarki.ad || "İsimsiz")+'</div>'+
      '<div class="sarki-alt">'+(sarki.sanatci || "YouTube")+'</div>';

    buton.onclick=function(){
      sarkiAc(index);
    };

    kutu.appendChild(buton);
  });
}

function aktifListeyiGuncelle(){
  document.querySelectorAll(".sarki-item").forEach(function(el,i){
    el.classList.toggle("aktif",i===seciliIndex);
  });
}

function sarkiAc(index){
  if(!sarkilar[index] || !oynatici)return;

  seciliIndex=index;
  var id=videoIdBul(sarkilar[index].url);

  if(!id){
    document.getElementById("durum").textContent="GEÇERSİZ YOUTUBE LİNKİ";
    return;
  }

  document.getElementById("sarkiAdi").textContent=sarkilar[index].ad || "İsimsiz";
  document.getElementById("durum").textContent="YÜKLENİYOR...";
  document.getElementById("progress").value=0;
  document.getElementById("gecen").textContent="00:00";
  document.getElementById("toplam").textContent="00:00";

  oynatici.loadVideoById(id);
  aktifListeyiGuncelle();
  document.getElementById("listePanel").classList.remove("acik");
}

function onYouTubeIframeAPIReady(){
  window.ytHazir=true;

  oynatici=new YT.Player("youtube-player",{
    videoId:"",
    width:"100%",
    height:"100%",
    playerVars:{
      controls:0,
      rel:0,
      playsinline:1,
      modestbranding:1
    },
    events:{
      onReady:function(){
        document.getElementById("durum").textContent="HAZIR";
        oynatici.setVolume(100);
        takipBaslat();
        ilkVideoyuHazirla();
      },
      onStateChange:function(e){
        var buton=document.getElementById("oynat");

        if(e.data===YT.PlayerState.PLAYING){
          buton.classList.add("oynuyor");
          document.getElementById("durum").textContent="ÇALIYOR";
        }

        if(e.data===YT.PlayerState.PAUSED){
          buton.classList.remove("oynuyor");
          document.getElementById("durum").textContent="DURAKLATILDI";
        }

        if(e.data===YT.PlayerState.ENDED){
          buton.classList.remove("oynuyor");
          document.getElementById("durum").textContent="BİTTİ";
        }
      }
    }
  });
}

function takipBaslat(){
  clearInterval(takip);

  takip=setInterval(function(){
    if(!oynatici || !oynatici.getDuration)return;

    var mevcut=oynatici.getCurrentTime();
    var toplam=oynatici.getDuration();

    if(!toplam)return;

    document.getElementById("gecen").textContent=formatSure(mevcut);
    document.getElementById("toplam").textContent=formatSure(toplam);
    document.getElementById("progress").value=(mevcut/toplam)*100;
  },300);
}

document.getElementById("oynat").onclick=function(){
  if(!oynatici)return;

  var durum=oynatici.getPlayerState();

  if(durum===YT.PlayerState.PLAYING) oynatici.pauseVideo();
  else oynatici.playVideo();
};

document.getElementById("geri").onclick=function(){
  if(!oynatici)return;
  oynatici.seekTo(Math.max(0,oynatici.getCurrentTime()-10),true);
};

document.getElementById("ileri").onclick=function(){
  if(!oynatici)return;
  oynatici.seekTo(oynatici.getCurrentTime()+10,true);
};

document.getElementById("progress").oninput=function(){
  if(!oynatici)return;
  var toplam=oynatici.getDuration();
  if(toplam) oynatici.seekTo(toplam*(Number(this.value)/100),true);
};

document.getElementById("ses").oninput=function(){
  if(!oynatici)return;
  oynatici.setVolume(Number(this.value));
};

document.getElementById("listeAc").onclick=function(){
  document.getElementById("listePanel").classList.add("acik");
};

document.getElementById("listeKapat").onclick=function(){
  document.getElementById("listePanel").classList.remove("acik");
};

listeyiOlustur();
</script>

<script src="videolar.js"></script>
<script>
bilgileriGetir();
</script>

<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
